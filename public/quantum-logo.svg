<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer hexagon -->
  <path d="M50 5 L85 27.5 L85 72.5 L50 95 L15 72.5 L15 27.5 Z" 
        stroke="url(#grad1)" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- Middle hexagon -->
  <path d="M50 15 L75 32.5 L75 67.5 L50 85 L25 67.5 L25 32.5 Z" 
        stroke="url(#grad2)" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- Center quantum sphere -->
  <circle cx="50" cy="50" r="20" fill="url(#sphere)"/>
  
  <!-- Quantum rings -->
  <ellipse cx="50" cy="50" rx="25" ry="8" 
           stroke="url(#ring1)" 
           stroke-width="1.5" 
           fill="none" 
           transform="rotate(30 50 50)"/>
  
  <ellipse cx="50" cy="50" rx="25" ry="8" 
           stroke="url(#ring2)" 
           stroke-width="1.5" 
           fill="none" 
           transform="rotate(-30 50 50)"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sphere">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>
